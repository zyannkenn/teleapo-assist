<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#122620">
  <meta name="description" content="Androidで営業テレアポを素早く回すための架電サポートツール">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>テレアポ架電サポート</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #15201c;
      --muted: #64706b;
      --line: #d9e0dc;
      --paper: #f7f8f5;
      --panel: #ffffff;
      --deep: #122620;
      --mint: #d8f3dc;
      --leaf: #2d6a4f;
      --blue: #1d4ed8;
      --amber: #b45309;
      --red: #b91c1c;
      --shadow: 0 18px 45px rgba(18, 38, 32, .12);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #eff5f0 0%, var(--paper) 38%, #f9faf7 100%);
      color: var(--ink);
      min-height: 100svh;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: min(100%, 820px);
      margin: 0 auto;
      padding: 14px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 4px 0 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .mark {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--deep);
      display: grid;
      place-items: center;
      color: white;
      flex: 0 0 auto;
    }

    .brand h1 {
      font-size: 18px;
      line-height: 1.1;
      margin: 0;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .pill {
      background: #eef7ef;
      color: var(--leaf);
      border: 1px solid #c9e8cf;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 12px;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    .panel {
      background: rgba(255, 255, 255, .94);
      border: 1px solid rgba(217, 224, 220, .9);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 18px;
      display: grid;
      gap: 15px;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .target h2 {
      margin: 0 0 8px;
      font-size: clamp(24px, 8vw, 40px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .target .company {
      color: var(--muted);
      font-size: 15px;
      min-height: 21px;
    }

    .phone {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: #f1f5f2;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .phone strong {
      font-size: clamp(24px, 8vw, 36px);
      letter-spacing: 0;
      overflow-wrap: anywhere;
      flex: 1;
    }

    .icon-button {
      width: 46px;
      height: 46px;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid var(--line);
      color: var(--ink);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .call-row {
      display: grid;
      grid-template-columns: 1fr 56px;
      gap: 10px;
    }

    .call {
      min-height: 58px;
      border-radius: 8px;
      background: var(--leaf);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      font-weight: 800;
      font-size: 19px;
    }

    .call[aria-disabled="true"] {
      background: #a7b0ab;
      pointer-events: none;
    }

    .next {
      min-height: 58px;
      border-radius: 8px;
      background: var(--deep);
      color: white;
      display: grid;
      place-items: center;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .status {
      min-height: 48px;
      border-radius: 8px;
      background: #f4f6f3;
      border: 1px solid var(--line);
      color: var(--ink);
      font-weight: 700;
    }

    .status[data-kind="hot"] { background: #eef6ff; color: var(--blue); }
    .status[data-kind="later"] { background: #fff7ed; color: var(--amber); }
    .status[data-kind="bad"] { background: #fff1f2; color: var(--red); }

    .notes {
      display: grid;
      gap: 8px;
    }

    textarea, input {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 12px;
      outline: none;
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    .section {
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .section-title h3 {
      margin: 0;
      font-size: 16px;
    }

    .section-title span {
      color: var(--muted);
      font-size: 12px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: #eef2ee;
      padding: 5px;
      border-radius: 8px;
    }

    .tab {
      min-height: 38px;
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      font-weight: 700;
    }

    .tab.active {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
    }

    .tab-panel {
      display: none;
      gap: 10px;
    }

    .tab-panel.active {
      display: grid;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .secondary {
      min-height: 46px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
      font-weight: 700;
    }

    .primary {
      min-height: 46px;
      border-radius: 8px;
      background: var(--deep);
      color: #fff;
      font-weight: 800;
    }

    .danger {
      color: var(--red);
    }

    .list {
      display: grid;
      gap: 8px;
      max-height: 300px;
      overflow: auto;
      padding-right: 2px;
    }

    .row {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 10px;
      display: grid;
      gap: 4px;
    }

    .row.current {
      border-color: #83c5a1;
      background: #f3fbf5;
    }

    .row button {
      background: transparent;
      text-align: left;
      padding: 0;
      color: inherit;
    }

    .row-main {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 14px;
      font-weight: 800;
    }

    .row-sub {
      color: var(--muted);
      font-size: 12px;
    }

    .empty {
      border: 1px dashed #b8c1bc;
      border-radius: 8px;
      padding: 16px;
      color: var(--muted);
      text-align: center;
      background: #fbfcfa;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .toast {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      min-height: 46px;
      border-radius: 8px;
      background: rgba(18, 38, 32, .96);
      color: white;
      display: none;
      place-items: center;
      padding: 12px;
      z-index: 20;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .toast.show {
      display: grid;
    }

    svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    @media (min-width: 760px) {
      .grid {
        grid-template-columns: 1.1fr .9fr;
        align-items: start;
      }

      .hero {
        position: sticky;
        top: 12px;
      }

      .status-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.2 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.77.62 2.6a2 2 0 0 1-.45 2.11L8 9.71a16 16 0 0 0 6.29 6.29l1.28-1.28a2 2 0 0 1 2.11-.45c.83.29 1.7.5 2.6.62A2 2 0 0 1 22 16.92z"/></svg>
        </div>
        <div>
          <h1>テレアポ架電サポート</h1>
          <p>番号準備、発信、結果記録を1画面で</p>
        </div>
      </div>
      <div class="pill" id="progressPill">0 / 0</div>
    </header>

    <div class="grid">
      <section class="panel hero" aria-label="現在の架電先">
        <div class="meta">
          <span id="queueLabel">架電リストなし</span>
          <span id="lastStatus">未記録</span>
        </div>

        <div class="target">
          <h2 id="targetName">CSVを追加してください</h2>
          <div class="company" id="targetCompany">会社名、担当者名、電話番号を読み込めます</div>
        </div>

        <div class="phone">
          <strong id="targetPhone">---</strong>
          <button class="icon-button" id="copyPhone" aria-label="電話番号をコピー" title="電話番号をコピー">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
        </div>

        <div class="call-row">
          <a class="call" id="callLink" href="#" aria-disabled="true">
            <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.2 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.77.62 2.6a2 2 0 0 1-.45 2.11L8 9.71a16 16 0 0 0 6.29 6.29l1.28-1.28a2 2 0 0 1 2.11-.45c.83.29 1.7.5 2.6.62A2 2 0 0 1 22 16.92z"/></svg>
            発信画面を開く
          </a>
          <button class="next" id="nextButton" aria-label="次へ" title="次へ">
            <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </button>
        </div>

        <div class="status-grid" aria-label="通話結果">
          <button class="status" data-result="不在">不在</button>
          <button class="status" data-result="担当者不在">担当者不在</button>
          <button class="status" data-result="再架電" data-kind="later">再架電</button>
          <button class="status" data-result="見込みあり" data-kind="hot">見込みあり</button>
          <button class="status" data-result="資料送付" data-kind="hot">資料送付</button>
          <button class="status" data-result="受付NG" data-kind="bad">受付NG</button>
          <button class="status" data-result="番号違い" data-kind="bad">番号違い</button>
          <button class="status" data-result="完了">完了</button>
        </div>

        <div class="notes">
          <input id="callbackAt" type="datetime-local" aria-label="再架電日時">
          <textarea id="memo" placeholder="会話メモ、受付名、次回アクションなど"></textarea>
          <button class="primary" id="saveMemo">メモだけ保存</button>
        </div>
      </section>

      <section class="panel section" aria-label="リスト管理">
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="list" role="tab">リスト</button>
          <button class="tab" data-tab="import" role="tab">追加</button>
          <button class="tab" data-tab="export" role="tab">出力</button>
        </div>

        <div class="tab-panel active" id="tab-list" role="tabpanel">
          <div class="section-title">
            <h3>架電先</h3>
            <span id="countLabel">0件</span>
          </div>
          <div class="list" id="contactList"></div>
        </div>

        <div class="tab-panel" id="tab-import" role="tabpanel">
          <div class="section-title">
            <h3>CSV貼り付け</h3>
            <span>名前,会社,電話</span>
          </div>
          <textarea id="csvInput" placeholder="例&#10;山田太郎,山田工務店,090-1234-5678&#10;佐藤花子,佐藤商事,03-1234-5678"></textarea>
          <div class="actions">
            <button class="primary" id="importCsv">CSVを取り込む</button>
            <button class="secondary" id="loadSample">サンプル</button>
          </div>

          <div class="section-title">
            <h3>1件追加</h3>
            <span>手入力</span>
          </div>
          <input id="manualName" placeholder="担当者名">
          <input id="manualCompany" placeholder="会社名">
          <input id="manualPhone" inputmode="tel" placeholder="電話番号">
          <button class="primary" id="addManual">追加する</button>
          <p class="hint">CSVの1行目が見出しでも取り込めます。電話番号らしい列を自動で探します。</p>
        </div>

        <div class="tab-panel" id="tab-export" role="tabpanel">
          <div class="section-title">
            <h3>記録の出力</h3>
            <span>CSV</span>
          </div>
          <div class="actions">
            <button class="primary" id="exportCsv">CSVをダウンロード</button>
            <button class="secondary" id="copyCsv">CSVをコピー</button>
          </div>
          <button class="secondary danger" id="clearData">全データを削除</button>
          <p class="hint">データはこの端末のブラウザ内に保存されます。サーバーには送信しません。</p>
        </div>
      </section>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = "teleapo-assist-v1";
    const $ = (selector) => document.querySelector(selector);
    const $$ = (selector) => Array.from(document.querySelectorAll(selector));

    const state = loadState();

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        return {
          contacts: Array.isArray(saved.contacts) ? saved.contacts : [],
          current: Number.isInteger(saved.current) ? saved.current : 0
        };
      } catch {
        return { contacts: [], current: 0 };
      }
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function normalizePhone(value) {
      return String(value || "").replace(/[^\d+]/g, "");
    }

    function displayPhone(value) {
      return String(value || "").trim() || "---";
    }

    function currentContact() {
      if (!state.contacts.length) return null;
      if (state.current < 0) state.current = 0;
      if (state.current >= state.contacts.length) state.current = state.contacts.length - 1;
      return state.contacts[state.current];
    }

    function render() {
      const contact = currentContact();
      const total = state.contacts.length;
      $("#progressPill").textContent = total ? `${state.current + 1} / ${total}` : "0 / 0";
      $("#countLabel").textContent = `${total}件`;
      $("#queueLabel").textContent = total ? `次の架電先` : "架電リストなし";

      if (!contact) {
        $("#targetName").textContent = "CSVを追加してください";
        $("#targetCompany").textContent = "会社名、担当者名、電話番号を読み込めます";
        $("#targetPhone").textContent = "---";
        $("#lastStatus").textContent = "未記録";
        $("#memo").value = "";
        $("#callbackAt").value = "";
        $("#callLink").href = "#";
        $("#callLink").setAttribute("aria-disabled", "true");
        renderList();
        return;
      }

      $("#targetName").textContent = contact.name || "名前なし";
      $("#targetCompany").textContent = contact.company || "会社名なし";
      $("#targetPhone").textContent = displayPhone(contact.phone);
      $("#lastStatus").textContent = contact.result || "未記録";
      $("#memo").value = contact.memo || "";
      $("#callbackAt").value = contact.callbackAt || "";

      const normalized = normalizePhone(contact.phone);
      $("#callLink").href = normalized ? `tel:${normalized}` : "#";
      $("#callLink").setAttribute("aria-disabled", normalized ? "false" : "true");
      renderList();
      persist();
    }

    function renderList() {
      const list = $("#contactList");
      list.innerHTML = "";
      if (!state.contacts.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "追加タブから架電先を入れてください";
        list.appendChild(empty);
        return;
      }

      state.contacts.forEach((contact, index) => {
        const row = document.createElement("div");
        row.className = `row${index === state.current ? " current" : ""}`;
        const button = document.createElement("button");
        button.type = "button";
        button.addEventListener("click", () => {
          state.current = index;
          render();
        });
        button.innerHTML = `
          <div class="row-main">
            <span>${escapeHtml(contact.name || "名前なし")}</span>
            <span>${escapeHtml(contact.result || "未記録")}</span>
          </div>
          <div class="row-sub">${escapeHtml(contact.company || "会社名なし")} / ${escapeHtml(displayPhone(contact.phone))}</div>
        `;
        row.appendChild(button);
        list.appendChild(row);
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function parseCsv(text) {
      const rows = [];
      let field = "";
      let row = [];
      let quoted = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];
        if (char === "\"" && quoted && next === "\"") {
          field += "\"";
          i += 1;
        } else if (char === "\"") {
          quoted = !quoted;
        } else if (char === "," && !quoted) {
          row.push(field.trim());
          field = "";
        } else if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && next === "\n") i += 1;
          row.push(field.trim());
          if (row.some(Boolean)) rows.push(row);
          row = [];
          field = "";
        } else {
          field += char;
        }
      }
      row.push(field.trim());
      if (row.some(Boolean)) rows.push(row);
      return rows;
    }

    function rowsToContacts(rows) {
      if (!rows.length) return [];
      const header = rows[0].map((cell) => cell.toLowerCase());
      const hasHeader = header.some((cell) => /name|名前|担当|会社|company|phone|tel|電話/.test(cell));
      const body = hasHeader ? rows.slice(1) : rows;

      const phoneIndex = hasHeader ? header.findIndex((cell) => /phone|tel|電話|番号/.test(cell)) : -1;
      const nameIndex = hasHeader ? header.findIndex((cell) => /name|名前|担当/.test(cell)) : -1;
      const companyIndex = hasHeader ? header.findIndex((cell) => /company|会社|法人|店舗/.test(cell)) : -1;

      return body.map((cells) => {
        const guessedPhone = phoneIndex >= 0 ? cells[phoneIndex] : cells.find((cell) => /0\d{1,4}[-\d\s()]{6,}/.test(cell)) || cells[2] || "";
        const guessedName = nameIndex >= 0 ? cells[nameIndex] : cells[0] || "";
        const guessedCompany = companyIndex >= 0 ? cells[companyIndex] : cells[1] || "";
        return {
          id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
          name: guessedName,
          company: guessedCompany,
          phone: guessedPhone,
          result: "",
          memo: "",
          callbackAt: "",
          updatedAt: ""
        };
      }).filter((contact) => contact.phone || contact.name || contact.company);
    }

    function markResult(result) {
      const contact = currentContact();
      if (!contact) return toast("先に架電先を追加してください");
      contact.result = result;
      contact.memo = $("#memo").value.trim();
      contact.callbackAt = $("#callbackAt").value;
      contact.updatedAt = new Date().toISOString();
      persist();
      toast(`${result}で記録しました`);
      if (state.current < state.contacts.length - 1) {
        state.current += 1;
      }
      render();
    }

    function toCsv() {
      const header = ["名前", "会社", "電話番号", "結果", "再架電日時", "メモ", "更新日時"];
      const lines = state.contacts.map((contact) => [
        contact.name,
        contact.company,
        contact.phone,
        contact.result,
        contact.callbackAt,
        contact.memo,
        contact.updatedAt
      ].map(csvCell).join(","));
      return [header.join(","), ...lines].join("\n");
    }

    function csvCell(value) {
      const text = String(value || "");
      return /[",\n\r]/.test(text) ? `"${text.replace(/"/g, "\"\"")}"` : text;
    }

    function toast(message) {
      const element = $("#toast");
      element.textContent = message;
      element.classList.add("show");
      window.clearTimeout(toast.timer);
      toast.timer = window.setTimeout(() => element.classList.remove("show"), 1800);
    }

    $$(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        $$(".tab").forEach((item) => item.classList.remove("active"));
        $$(".tab-panel").forEach((item) => item.classList.remove("active"));
        tab.classList.add("active");
        $(`#tab-${tab.dataset.tab}`).classList.add("active");
      });
    });

    $$(".status").forEach((button) => {
      button.addEventListener("click", () => markResult(button.dataset.result));
    });

    $("#nextButton").addEventListener("click", () => {
      if (!state.contacts.length) return toast("架電先がありません");
      state.current = Math.min(state.current + 1, state.contacts.length - 1);
      render();
    });

    $("#copyPhone").addEventListener("click", async () => {
      const contact = currentContact();
      if (!contact || !contact.phone) return toast("コピーする番号がありません");
      try {
        await navigator.clipboard.writeText(contact.phone);
        toast("電話番号をコピーしました");
      } catch {
        toast("コピーできませんでした");
      }
    });

    $("#saveMemo").addEventListener("click", () => {
      const contact = currentContact();
      if (!contact) return toast("先に架電先を追加してください");
      contact.memo = $("#memo").value.trim();
      contact.callbackAt = $("#callbackAt").value;
      contact.updatedAt = new Date().toISOString();
      persist();
      render();
      toast("メモを保存しました");
    });

    $("#importCsv").addEventListener("click", () => {
      const contacts = rowsToContacts(parseCsv($("#csvInput").value));
      if (!contacts.length) return toast("取り込める行がありません");
      state.contacts.push(...contacts);
      if (state.contacts.length === contacts.length) state.current = 0;
      $("#csvInput").value = "";
      persist();
      render();
      toast(`${contacts.length}件取り込みました`);
    });

    $("#loadSample").addEventListener("click", () => {
      $("#csvInput").value = "名前,会社,電話番号\n山田太郎,山田工務店,090-1234-5678\n佐藤花子,佐藤商事,03-1234-5678";
    });

    $("#addManual").addEventListener("click", () => {
      const contact = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        name: $("#manualName").value.trim(),
        company: $("#manualCompany").value.trim(),
        phone: $("#manualPhone").value.trim(),
        result: "",
        memo: "",
        callbackAt: "",
        updatedAt: ""
      };
      if (!contact.name && !contact.company && !contact.phone) return toast("追加内容を入力してください");
      state.contacts.push(contact);
      state.current = state.contacts.length - 1;
      $("#manualName").value = "";
      $("#manualCompany").value = "";
      $("#manualPhone").value = "";
      persist();
      render();
      toast("1件追加しました");
    });

    $("#exportCsv").addEventListener("click", () => {
      const blob = new Blob([toCsv()], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `teleapo-${new Date().toISOString().slice(0, 10)}.csv`;
      link.click();
      URL.revokeObjectURL(url);
    });

    $("#copyCsv").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(toCsv());
        toast("CSVをコピーしました");
      } catch {
        toast("コピーできませんでした");
      }
    });

    $("#clearData").addEventListener("click", () => {
      if (!confirm("すべての架電先と記録を削除しますか？")) return;
      state.contacts = [];
      state.current = 0;
      persist();
      render();
      toast("削除しました");
    });

    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    render();
  </script>
</body>
</html>
